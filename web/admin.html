<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataCache · 운영</title>
<link rel="icon" href="/static/favicon.png">
<style>
  :root { --primary: #FF5F5F; --primary-dark: #E84646; --ink: #333; --sub: #6E6E73; --line: #ECECEE; --bg: #FAFAFB; --ok: #16A36B; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 28px; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 22px; }
  h1 img { width: 32px; }
  .o { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .top { display: flex; justify-content: space-between; gap: 10px; }
  .st { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: #F1F1F3; }
  .st.ready { background: #E6F7EF; color: var(--ok); } .st.failed { background: #FFECEC; color: var(--primary-dark); }
  .meta { color: var(--sub); font-size: 13px; margin-top: 6px; }
  h2 { font-size: 18px; margin: 30px 0 6px; }
  .steps { margin: 10px 0 0; padding-left: 18px; font-size: 13px; color: var(--sub); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .row input { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font: inherit; }
  button.no { background: #F1F1F3; color: var(--ink); }
  button { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; background: var(--primary); color: #fff; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body><div class="wrap">
  <h1><img src="/static/icon.png" alt="">주문 관리</h1>
  <p class="meta">계약·결제를 확인한 뒤 승인하면 묶음(LeRobot)이 만들어지고 구매자 화면에 내려받기 주소가 나타납니다.</p>
  <div id="list">불러오는 중…</div>
  <h2>말로 받은 의뢰</h2>
  <p class="meta">채팅 의뢰로 열린 미션. 목표 시간을 채웠거나 계약이 끝나면 닫아 주세요 — 닫으면 앱에서 사라집니다.</p>
  <div id="requests">불러오는 중…</div>
  <h2>이의 신청</h2>
  <p class="meta">자동 확인으로 끝나지 않은 신청만 결정이 필요합니다. '가려야 할 게 보여요'는 신청 즉시 판매에서 빠지고, 인정하지 않으면 다시 판매됩니다.</p>
  <div id="appeals">불러오는 중…</div>
</div>
<script>
const token = new URLSearchParams(location.search).get("token") || "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const won = n => (Math.round(n) || 0).toLocaleString("ko-KR") + "원";
async function load() {
  const r = await fetch("/api/admin/orders?token=" + encodeURIComponent(token));
  if (!r.ok) { document.getElementById("list").textContent = "토큰이 맞지 않습니다"; return; }
  const os = (await r.json()).orders;
  document.getElementById("list").innerHTML = os.length ? os.map(o => `<div class="o"><div class="top"><b>${esc(o.org)} · ${esc(o.email)}</b>
    <span class="st ${esc(o.status)}">${esc(o.status)}</span></div>
    <div class="meta">${esc(o.created)} · ${o.missions.length ? esc(o.missions.join(", ")) : "전체 미션"} · ${esc(o.quote.level_ko)} · ${o.quote.hours}시간 · ${won(o.quote.total)}
    ${o.size_mb ? ` · ${o.size_mb}MB · 녹화 ${o.recordings}편 · 받은 횟수 ${o.downloads}` : ""}${o.error ? `<br>오류: ${esc(o.error)}` : ""}${o.note ? `<br>요청: ${esc(o.note)}` : ""}</div>
    ${o.status === "pending" || o.status === "failed" ? `<button onclick="approve('${esc(o.id)}')">승인하고 묶음 만들기</button>` : ""}</div>`).join("") : "아직 주문이 없습니다";
  if (os.some(o => o.status === "building")) setTimeout(load, 3000);
}
async function approve(id) { await fetch(`/api/admin/orders/${encodeURIComponent(id)}/approve?token=${encodeURIComponent(token)}`, {method: "POST"}); setTimeout(load, 600); }
const STATE = {auto: "자동 확인", review: "검토 필요", reprocessing: "다시 처리 중", accepted: "인정", rejected: "인정 안 함"};
async function loadAppeals() {
  const r = await fetch("/api/admin/appeals?token=" + encodeURIComponent(token));
  if (!r.ok) return;
  const as = (await r.json()).appeals;
  document.getElementById("appeals").innerHTML = as.length ? as.map(a => `<div class="o"><div class="top"><b>${esc(a.reason_ko)} · 녹화 ${esc(a.sid)}</b>
    <span class="st ${a.state === "accepted" ? "ready" : a.state === "rejected" ? "failed" : ""}">${esc(STATE[a.state] || a.state)}</span></div>
    <div class="meta">${esc(a.created)} · 기기 ${esc(a.device)}${a.detail ? `<br>내용: ${esc(a.detail)}` : ""}${a.extra_reward ? ` · 추가 보상 ${won(a.extra_reward)}` : ""}</div>
    <ol class="steps">${a.steps.map(s => `<li>${esc(s.note)} <span style="opacity:.6">${esc(s.at)}</span></li>`).join("")}</ol>
    ${a.state === "review" ? `<div class="row"><input id="note-${esc(a.id)}" placeholder="결정 이유"><input id="won-${esc(a.id)}" type="number" min="0" step="10" placeholder="추가 보상(원)" style="width:130px">
      <button onclick="decide('${esc(a.id)}', true)">인정</button><button class="no" onclick="decide('${esc(a.id)}', false)">인정 안 함</button></div>` : ""}</div>`).join("") : "이의 신청이 없습니다";
}
async function decide(id, accept) {
  const note = document.getElementById("note-" + id).value, extra = +document.getElementById("won-" + id).value || 0;
  await fetch(`/api/admin/appeals/${encodeURIComponent(id)}?token=${encodeURIComponent(token)}`,
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({accept, extra_reward: extra, note})});
  loadAppeals();
}
async function loadRequests() {
  const r = await fetch("/api/admin/requests?token=" + encodeURIComponent(token));
  if (!r.ok) return;
  const rs = (await r.json()).requests;
  document.getElementById("requests").innerHTML = rs.length ? rs.map(q => `<div class="o"><div class="top"><b>${esc(q.title)} · ${esc(q.org)}</b>
    <span class="st ${q.status === "collecting" ? "ready" : ""}">${q.status === "collecting" ? "모으는 중" : "닫힘"}</span></div>
    <div class="meta">${esc(q.email)} · ${won(q.quote.total)} · ${q.quote.hours}시간 · ${(q.quote.sensors_ko || []).map(esc).join(", ")}
    <br>${q.missions.map(m => `${esc(m.title)} ${m.collected_hours}/${m.target_hours}시간`).join(" · ")}</div>
    ${q.status === "collecting" ? `<button class="no" onclick="closeReq('${esc(q.id)}')">의뢰 닫기</button>` : ""}</div>`).join("") : "의뢰가 없습니다";
}
async function closeReq(id) { await fetch(`/api/admin/requests/${encodeURIComponent(id)}/close?token=${encodeURIComponent(token)}`, {method: "POST"}); loadRequests(); }
load();
loadRequests();
loadAppeals();
</script>
</body>
</html>

# Baseten: 참여자 얼굴 → 가상 인물 (LivePortrait, MIT) 을 GPU 에서. 클라우드 서버(Hugging Face, GPU 없음)가 DATACASH_FACESWAP=baseten 일 때 부른다.
# 올리기: scripts/push_baseten.sh (datacash 코드·가상 인물·모델 파일을 packages/ 에 복사한 뒤 truss push)
model_name: datacash-faceswap
python_version: py311
resources:
  accelerator: T4
  use_gpu: true
  cpu: "4"
  memory: 16Gi
system_packages:
  - git
  - libgl1
  - libglib2.0-0
requirements:
  - torch==2.3.0
  - torchvision==0.18.0
  - numpy==1.26.4
  - scipy==1.13.1
  - opencv-contrib-python-headless==4.10.0.84
  - mediapipe==0.10.14
  - onnxruntime-gpu==1.18.0
  - pyyaml==6.0.1
  - imageio-ffmpeg==0.5.1
  - tyro==0.8.5
  - rich==13.7.1
  - httpx==0.27.2
  - huggingface_hub==0.24.6
build_commands:
  - git clone https://github.com/KwaiVGI/LivePortrait /app/liveportrait && cd /app/liveportrait && git checkout 9b294b3d0536135442ea73cb01e6cb3ca7029dd3
  - python -c "from huggingface_hub import snapshot_download; snapshot_download('KwaiVGI/LivePortrait', local_dir='/app/liveportrait/pretrained_weights', allow_patterns=['liveportrait/*', 'insightface/*'])"
environment_variables:
  LP_ROOT: /app/liveportrait
  DATACASH_DATA: /packages/data
runtime:
  predict_concurrency: 1

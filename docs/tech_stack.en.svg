<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1180" height="720" rx="14" fill="#FFFFFF"/><rect x="30" y="30" width="330" height="560" rx="16" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="48" y="60" font-size="16" fill="#4A1B0C" font-weight="600" text-anchor="start" dominant-baseline="central">Participant devices (same Wi-Fi)</text><rect x="50" y="80" width="290" height="160" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="68" y="110" font-size="15" fill="#4A1B0C" font-weight="600" text-anchor="start" dominant-baseline="central">Android app · Java</text><text x="68" y="138" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Camera2 · MediaRecorder video</text><text x="68" y="161" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Phone IMU · microphone (WAV)</text><text x="68" y="184" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">18–20 kHz acoustic beacon (sync)</text><text x="68" y="207" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Finds the server via NsdManager</text><rect x="50" y="260" width="290" height="160" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1.2"/><text x="68" y="290" font-size="15" fill="#4A1B0C" font-weight="600" text-anchor="start" dominant-baseline="central">Wear OS watch app · Java</text><text x="68" y="318" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">IMU 100 Hz · vibration pulses (touch)</text><text x="68" y="341" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Samsung Health Sensor SDK 1.4.1</text><text x="68" y="364" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Heart rate · IBI · skin temperature</text><text x="68" y="387" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Uploads directly to the server</text><rect x="50" y="470" width="290" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="195.0" y="493.0" font-size="16" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">Buyer's browser</text><text x="195.0" y="515.0" font-size="13" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">Request · timeline · download</text><rect x="410" y="30" width="420" height="560" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="428" y="60" font-size="16" fill="#04342C" font-weight="600" text-anchor="start" dominant-baseline="central">Mac server (Apple Silicon · Python 3.12)</text><rect x="430" y="80" width="380" height="115" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="448" y="110" font-size="15" fill="#04342C" font-weight="600" text-anchor="start" dominant-baseline="central">FastAPI + Uvicorn :8800</text><text x="448" y="138" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">Token auth (X-DC-Token)</text><text x="448" y="161" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">mDNS advertising via dns-sd</text><text x="448" y="184" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">Jinja2 web · operator page</text><rect x="430" y="210" width="380" height="115" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="448" y="240" font-size="15" fill="#04342C" font-weight="600" text-anchor="start" dominant-baseline="central">Processing worker</text><text x="448" y="268" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">In-process queue + thread</text><text x="448" y="291" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">One recording at a time</text><text x="448" y="314" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">API cost ledger · budget cap</text><rect x="430" y="340" width="380" height="140" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="448" y="370" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start" dominant-baseline="central">Libraries running on the Mac</text><text x="448" y="398" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">MediaPipe · OpenCV (YuNet · SFace)</text><text x="448" y="421" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">LivePortrait (PyTorch)</text><text x="448" y="444" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Numba (SAM mask decoding)</text><text x="448" y="467" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">NumPy · SciPy · pandas · ffmpeg</text><rect x="430" y="495" width="380" height="80" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="448" y="525" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start" dominant-baseline="central">File storage (data/)</text><text x="448" y="553" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Recording &amp; output folders</text><rect x="880" y="30" width="270" height="560" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="898" y="60" font-size="16" fill="#042C53" font-weight="600" text-anchor="start" dominant-baseline="central">External APIs (HTTPS)</text><rect x="900" y="80" width="230" height="140" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="918" y="110" font-size="15" fill="#042C53" font-weight="600" text-anchor="start" dominant-baseline="central">Meta Model API</text><text x="918" y="138" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">OpenAI-SDK compatible</text><text x="918" y="161" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">SAM 3.1 · Muse Spark 1.3</text><text x="918" y="184" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">Muse Image · Voice Transcribe</text><rect x="900" y="240" width="230" height="115" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="918" y="270" font-size="15" fill="#042C53" font-weight="600" text-anchor="start" dominant-baseline="central">Muse Spark Open 816B</text><text x="918" y="298" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">Baseten → Fireworks fallback</text><text x="918" y="321" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">Second opinion · appeals</text><rect x="900" y="375" width="230" height="90" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="918" y="405" font-size="15" fill="#042C53" font-weight="600" text-anchor="start" dominant-baseline="central">AWS S3 (boto3)</text><text x="918" y="433" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">Training data upload (optional)</text><path d="M340 160 L428 130" fill="none" stroke="#993C1D" stroke-width="1.6" marker-end="url(#a)"/><path d="M340 340 L380 340 L380 150 L428 150" fill="none" stroke="#993C1D" stroke-width="1.6" marker-end="url(#a)"/><path d="M340 502 L395 502 L395 175 L428 175" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a)"/><path d="M620 195 L620 208" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><path d="M810 265 L898 150" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a)"/><text x="850" y="180" font-size="12.5" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">HTTPS</text><path d="M810 285 L898 297" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a)"/><text x="590" y="625" font-size="13.5" fill="#2C2C2A" font-weight="600" text-anchor="middle" dominant-baseline="central">Deployment: no Docker or cloud — one Mac runs everything (pip install -e . → python -m datacash.server.app)</text><text x="590" y="650" font-size="13" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">apps built with gradlew as APKs · tested with pytest</text></svg>

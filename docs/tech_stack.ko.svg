y="341" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">Samsung Health Sensor SDK 1.4.1</text><text x="68" y="364" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">심박 · 박동 간격 · 피부온도</text><text x="68" y="387" font-size="13.5" fill="#993C1D" font-weight="400" text-anchor="start" dominant-baseline="central">서버로 직접 업로드</text><rect x="50" y="470" width="290" height="64" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/><text x="195.0" y="493.0" font-size="16" fill="#26215C" font-weight="600" text-anchor="middle" dominant-baseline="central">구매 기업 브라우저</text><text x="195.0" y="515.0" font-size="13" fill="#534AB7" font-weight="400" text-anchor="middle" dominant-baseline="central">의뢰 · 타임라인 · 내려받기</text><rect x="410" y="30" width="420" height="560" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="428" y="60" font-size="16" fill="#04342C" font-weight="600" text-anchor="start" dominant-baseline="central">맥 서버 (Apple Silicon · Python 3.12)</text><rect x="430" y="80" width="380" height="115" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="448" y="110" font-size="15" fill="#04342C" font-weight="600" text-anchor="start" dominant-baseline="central">FastAPI + Uvicorn :8800</text><text x="448" y="138" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">토큰 인증 (X-DC-Token)</text><text x="448" y="161" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">dns-sd 로 mDNS 알림</text><text x="448" y="184" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">Jinja2 웹 · 운영자 화면</text><rect x="430" y="210" width="380" height="115" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/><text x="448" y="240" font-size="15" fill="#04342C" font-weight="600" text-anchor="start" dominant-baseline="central">처리 작업자</text><text x="448" y="268" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">앱 안의 대기열 + 스레드</text><text x="448" y="291" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">녹화 한 편씩 순서대로</text><text x="448" y="314" font-size="13.5" fill="#0F6E56" font-weight="400" text-anchor="start" dominant-baseline="central">API 비용 장부 · 한도</text><rect x="430" y="340" width="380" height="140" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="448" y="370" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start" dominant-baseline="central">이 맥에서 도는 라이브러리</text><text x="448" y="398" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">MediaPipe · OpenCV (YuNet · SFace)</text><text x="448" y="421" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">LivePortrait (PyTorch)</text><text x="448" y="444" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">Numba (SAM 마스크 해독)</text><text x="448" y="467" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">NumPy · SciPy · pandas · ffmpeg</text><rect x="430" y="495" width="380" height="80" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.2"/><text x="448" y="525" font-size="15" fill="#2C2C2A" font-weight="600" text-anchor="start" dominant-baseline="central">파일 저장소 (data/)</text><text x="448" y="553" font-size="13.5" fill="#5F5E5A" font-weight="400" text-anchor="start" dominant-baseline="central">녹화 · 처리 결과 폴더</text><rect x="880" y="30" width="270" height="560" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="898" y="60" font-size="16" fill="#042C53" font-weight="600" text-anchor="start" dominant-baseline="central">외부 API (HTTPS)</text><rect x="900" y="80" width="230" height="140" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="918" y="110" font-size="15" fill="#042C53" font-weight="600" text-anchor="start" dominant-baseline="central">Meta Model API</text><text x="918" y="138" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">OpenAI SDK 호환</text><text x="918" y="161" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">SAM 3.1 · Muse Spark 1.3</text><text x="918" y="184" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">Muse Image · Voice Transcribe</text><rect x="900" y="240" width="230" height="115" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="918" y="270" font-size="15" fill="#042C53" font-weight="600" text-anchor="start" dominant-baseline="central">Muse Spark Open 816B</text><text x="918" y="298" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">Baseten → 안 되면 Fireworks</text><text x="918" y="321" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">2차 검증 · 이의 신청</text><rect x="900" y="375" width="230" height="90" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/><text x="918" y="405" font-size="15" fill="#042C53" font-weight="600" text-anchor="start" dominant-baseline="central">AWS S3 (boto3)</text><text x="918" y="433" font-size="13.5" fill="#185FA5" font-weight="400" text-anchor="start" dominant-baseline="central">학습 데이터 올리기 (선택)</text><path d="M340 160 L428 130" fill="none" stroke="#993C1D" stroke-width="1.6" marker-end="url(#a)"/><path d="M340 340 L380 340 L380 150 L428 150" fill="none" stroke="#993C1D" stroke-width="1.6" marker-end="url(#a)"/><path d="M340 502 L395 502 L395 175 L428 175" fill="none" stroke="#534AB7" stroke-width="1.6" marker-end="url(#a)"/><path d="M620 195 L620 208" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><path d="M810 265 L898 150" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a)"/><text x="850" y="180" font-size="12.5" fill="#185FA5" font-weight="400" text-anchor="middle" dominant-baseline="central">HTTPS</text><path d="M810 285 L898 297" fill="none" stroke="#185FA5" stroke-width="1.6" marker-end="url(#a)"/><text x="590" y="625" font-size="13.5" fill="#2C2C2A" font-weight="600" text-anchor="middle" dominant-baseline="central">배포: Docker·클라우드 없이 맥 한 대에서 실행 (pip install -e . → python -m datacash.server.app)</text><text x="590" y="650" font-size="13" fill="#5F5E5A" font-weight="400" text-anchor="middle" dominant-baseline="central">앱은 gradlew 로 APK 빌드 후 설치 · 검증은 pytest</text></svg>
